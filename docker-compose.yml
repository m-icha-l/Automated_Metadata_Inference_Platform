services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: diwa_user
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: metadata_db
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db