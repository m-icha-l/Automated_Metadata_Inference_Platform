services:
  db:
    image: postgis/postgis:16-3.4
    container_name: diwa-db
    environment:
      POSTGRES_USER: postgis
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD (copy .env.example to .env)}
      POSTGRES_DB: diwa
    ports:
      - "5432:5432"
    volumes:
      - diwa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgis -d diwa"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: diwa-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_USER=postgis
      - DB_NAME=diwa

volumes:
  diwa-pgdata: